<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Secure Access</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="main.js" defer></script>
</head>
<body>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="card-header" style="text-align: center;">
                <i class="fas fa-shield-toggle" style="font-size: 3rem; color: #10b981; margin-bottom: 1rem;"></i>
                <h2>AccessGranted</h2>
                <p>Welcome to the secure zone. Your token is active.</p>
            </div>

            <button type="button" class="submit-btn js-logout" style="background: #ef4444; margin-top: 1rem;">
                <span>Log Out</span>
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

</body>
</html>
